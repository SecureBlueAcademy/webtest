<svg viewBox="0 0 1600 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Authentication factors visualization">
  <defs>
    <style>
      .title { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 20px; font-weight: 900; fill: #ffffff; }
      .label { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 18px; font-weight: 800; fill: #ffffff; }
      .subtext { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #bfc9ff; }
      .card-rect { fill: rgba(15,20,35,0.65); stroke: rgba(255,255,255,0.14); stroke-width: 1.4; filter: url(#outerGlow); }
      .tile { fill: rgba(255,255,255,0.04); stroke: rgba(255,255,255,0.12); stroke-width: 1.2; }
      .icon-stroke-blue { stroke: #54a0ff; }
      .icon-stroke-green { stroke: #1dd1a1; }
      .icon-stroke-purple { stroke: #a855f7; }
      .icon-stroke-orange { stroke: #ff9f43; }
      .icon-line { fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
      .card:hover .card-rect { stroke: #b58cff; stroke-width: 2; }
      .arrow { stroke: #b58cff; stroke-width: 2.2; fill: none; filter: url(#outerGlow); stroke-dasharray: 6 6; animation: dash 6s linear infinite; }
      @keyframes dash { to { stroke-dashoffset: -36; } }
    </style>
    <filter id="outerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <marker id="arrowHead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b58cff" />
    </marker>
  </defs>

  <g class="card" transform="translate(100 80)">
    <rect class="card-rect" rx="18" ry="18" width="400" height="240" />
    <rect class="tile" x="26" y="28" rx="12" ry="12" width="70" height="70" />
    <g transform="translate(40 40)">
      <circle cx="20" cy="20" r="16" class="icon-line icon-stroke-blue" />
      <path d="M12 24c0-6 16-6 16 0" class="icon-line icon-stroke-blue" />
      <circle cx="20" cy="20" r="3" fill="#54a0ff" />
      <path d="M20 23v8" class="icon-line icon-stroke-blue" />
    </g>
    <text class="title" x="120" y="54">Something You KNOW</text>
    <text class="subtext" x="120" y="82">Password, PIN</text>
    <text class="label" x="32" y="150">Knowledge</text>
    <text class="subtext" x="32" y="176">Secrets stored in your mind</text>
  </g>

  <g class="card" transform="translate(600 80)">
    <rect class="card-rect" rx="18" ry="18" width="400" height="240" />
    <rect class="tile" x="26" y="28" rx="12" ry="12" width="70" height="70" />
    <g transform="translate(38 38)">
      <rect x="6" y="6" width="28" height="44" rx="6" class="icon-line icon-stroke-green" />
      <circle cx="20" cy="44" r="2" fill="#1dd1a1" />
      <path d="M40 22h14" class="icon-line icon-stroke-green" />
      <circle cx="56" cy="22" r="4" class="icon-line icon-stroke-green" />
    </g>
    <text class="title" x="120" y="54">Something You HAVE</text>
    <text class="subtext" x="120" y="82">Phone, Security Key</text>
    <text class="label" x="32" y="150">Possession</text>
    <text class="subtext" x="32" y="176">Physical devices you control</text>
  </g>

  <g class="card" transform="translate(1100 80)">
    <rect class="card-rect" rx="18" ry="18" width="400" height="240" />
    <rect class="tile" x="26" y="28" rx="12" ry="12" width="70" height="70" />
    <g transform="translate(40 40)">
      <path d="M20 10c-8 0-12 7-12 14v6" class="icon-line icon-stroke-purple" />
      <path d="M20 14c-5 0-8 5-8 10v6" class="icon-line icon-stroke-purple" />
      <path d="M20 18c-3 0-5 3-5 7v7" class="icon-line icon-stroke-purple" />
      <path d="M20 6c10 0 16 8 16 16v12" class="icon-line icon-stroke-purple" />
    </g>
    <text class="title" x="120" y="54">Something You ARE</text>
    <text class="subtext" x="120" y="82">Fingerprint, Face ID</text>
    <text class="label" x="32" y="150">Inherence</text>
    <text class="subtext" x="32" y="176">Biometric identity traits</text>
  </g>

  <g transform="translate(760 370)">
    <rect class="tile" x="-30" y="-18" rx="10" ry="10" width="60" height="48" />
    <path d="M-12 -6v-6c0-10 24-10 24 0v6" class="icon-line icon-stroke-orange" />
    <rect x="-14" y="-6" width="28" height="26" rx="6" class="icon-line icon-stroke-orange" />
    <circle cx="0" cy="7" r="3" fill="#ff9f43" />
    <text class="label" x="0" y="40" text-anchor="middle">MFA</text>
  </g>

  <path class="arrow" d="M300 320 C 420 365, 620 365, 740 370" marker-end="url(#arrowHead)" />
  <path class="arrow" d="M1300 320 C 1180 365, 980 365, 860 370" marker-end="url(#arrowHead)" />
</svg>
